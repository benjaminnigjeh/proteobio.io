<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProteoBio | Coming Soon</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #09090f;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: 700;
      color: #00d4ff;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo-icon { font-size: 1.5rem; }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 20px;
    }

    .gradient {
      background: linear-gradient(135deg, #00d4ff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      color: #94a3b8;
      font-size: 1.1rem;
      max-width: 440px;
      margin: 0 auto 40px;
      line-height: 1.65;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 212, 255, 0.08);
      border: 1px solid rgba(0, 212, 255, 0.25);
      border-radius: 100px;
      padding: 8px 20px;
      font-size: 0.85rem;
      color: #00d4ff;
      margin-bottom: 32px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #00d4ff;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    a {
      color: #00d4ff;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div>
    <div class="logo">
      <span class="logo-icon">⬡</span>
      ProteoBio
    </div>
    <div class="badge">
      <span class="dot"></span>
      Under Construction
    </div>
    <h1>Something big<br />is <span class="gradient">coming soon</span></h1>
    <p>
      We're building ProteoAgent — a multi-agent AI platform for proteomics research.
      Check back soon or reach out at <a href="mailto:admin@proteobio.io">admin@proteobio.io</a>
    </p>
  </div>
</body>
</html>
